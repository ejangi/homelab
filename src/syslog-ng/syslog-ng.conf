@version: 3.38
options { keep-hostname(yes); use-dns(no); chain-hostnames(no); flush-lines(1); time-zone("Australia/Brisbane"); };
source s_orbi { network(ip("${SYSLOG_LAN_IP}") port(5514) transport("tcp") flags(store-raw-message) log-msg-size(65536)); };
filter f_rbr { netmask("10.0.0.1/32"); };
filter f_rbs { netmask("10.0.0.12/32"); };
template t_record { template("received=${R_ISODATE} sent=${S_ISODATE} source=${SOURCEIP} host=${HOST} facility=${FACILITY} severity=${LEVEL} raw=${RAWMSG}\n"); };
destination d_rbr { file("/var/log/orbi/orbi-rbr20.log" template(t_record) perm(0640)); };
destination d_rbs { file("/var/log/orbi/orbi-rbs20.log" template(t_record) perm(0640)); };
log { source(s_orbi); filter(f_rbr); destination(d_rbr); flags(flow-control); };
log { source(s_orbi); filter(f_rbs); destination(d_rbs); flags(flow-control); };
