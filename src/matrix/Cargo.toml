[package]
name = "matrix-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
ammonia = "4.1"
anyhow = "1.0"
futures-util = "0.3"
hex = "0.4"
html2text = "0.12"
image = { version = "0.25.8", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
matrix-sdk = { version = "0.5.0", default-features = false, features = ["e2e-encryption", "rustls-tls"] }
matrix-sdk-sql = { version = "0.1.0-beta.2", default-features = false, features = ["e2e-encryption", "postgres", "rustls"] }
mime = "0.3"
pulldown-cmark = "0.12"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "stream"] }
rocket = { version = "0.5.1", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.5.13", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio-rustls"] }
subtle = "2.6"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.16", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1.4"
