services:
  # 1. N8N SERVICE
  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    sysctls:
      # CRITICAL FIX: Keep IPv6 disabled to avoid resolution confusion
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    environment:
      # Database Connection Settings - SWITCHED TO POSTGRES
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      # Network/Host Settings - UPDATED FOR CADDY/HTTPS
      - N8N_LISTEN_ADDRESS=${N8N_LISTEN_ADDRESS}
      - N8N_PATH=${N8N_PATH}
      # The WEBHOOK_URL must be HTTPS now that Caddy handles security
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_HOST=${N8N_HOST}
      # CRITICAL: Change N8N_PROTOCOL to https
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      # Security & Timezone
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # Required by the Matrix Sender workflow, whose documented contract uses
      # environment-backed Matrix Service URL and API-key expressions.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Internal Matrix notification service
      - MATRIX_SERVICE_URL=${MATRIX_SERVICE_URL}
      - MATRIX_SERVICE_API_KEY=${MATRIX_SERVICE_API_KEY}
      # Change N8N_SECURE_COOKIE to true as we are using HTTPS
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${TZ}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres
    networks:
      - n8n_backend

  # 2.5 MATRIX SERVICE
  matrix:
    build:
      context: ./src/matrix
    container_name: n8n_matrix
    restart: unless-stopped
    environment:
      - MATRIX_HOMESERVER_URL=${MATRIX_HOMESERVER_URL}
      - MATRIX_USER_ID=${MATRIX_USER_ID}
      - MATRIX_PASSWORD=${MATRIX_PASSWORD}
      - MATRIX_DEFAULT_ROOM_ID=${MATRIX_DEFAULT_ROOM_ID}
      - MATRIX_SERVICE_API_KEY=${MATRIX_SERVICE_API_KEY}
      - MATRIX_STORE_ENCRYPTION_KEY=${MATRIX_STORE_ENCRYPTION_KEY}
      - MATRIX_IDEMPOTENCY_RETENTION_DAYS=${MATRIX_IDEMPOTENCY_RETENTION_DAYS}
      - MATRIX_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - RUST_LOG=matrix_service=info,rocket=warn
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8787/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - n8n_backend

  # 2. POSTGRES SERVICE
  postgres:
    image: postgres:15-alpine
    container_name: n8n_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Note: We use $$ to escape the $ sign, allowing the shell to access the environment variable
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - n8n_backend

  # 3. CADDY SERVICE (Reverse Proxy & Automatic HTTPS)
  caddy:
    image: caddy:latest
    container_name: n8n_caddy
    restart: always
    ports:
      # Expose standard web ports
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      # CRITICAL: Mount the local Caddyfile into the container's config path
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Volume for Caddy's data (including SSL certificates)
      - caddy_data:/data
    depends_on:
      - n8n
      - matrix
    networks:
      - n8n_backend

  # 4. POSTGRES BACKUP SERVICE
  postgres_backup:
    image: postgres:15-alpine # Use the same image to ensure compatibility with pg_dump
    container_name: n8n_postgres_backup
    restart: "no"
    environment:
      # Database Connection Details - Variables are set for n8n/postgres compatibility
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${POSTGRES_DB}
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      # Backup settings
      - BACKUP_DIR=/backups
    volumes:
      # Mount a local directory for backups (bind mount)
      - ./backups:/backups
      # CRITICAL: Mount a script that performs the actual backup and scheduling
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy # Ensure postgres is up and ready
    networks:
      - n8n_backend
    command:
      ["sh", "-c", "while true; do /usr/local/bin/backup.sh; sleep 86400; done"]

  # 5. SFTPGO SERVICE
  # SFTPGo provides the web file UI at /files and stores its configuration in
  # the existing PostgreSQL database. A table prefix keeps its tables isolated
  # from n8n while retaining the existing nightly PostgreSQL backup coverage.
  sftpgo:
    image: drakkan/sftpgo:v2.7.1-alpine
    container_name: sftpgo
    restart: unless-stopped
    environment:
      SFTPGO_DATA_PROVIDER__DRIVER: postgresql
      SFTPGO_DATA_PROVIDER__HOST: postgres
      SFTPGO_DATA_PROVIDER__PORT: "5432"
      SFTPGO_DATA_PROVIDER__NAME: ${POSTGRES_DB}
      SFTPGO_DATA_PROVIDER__USERNAME: ${POSTGRES_USER}
      SFTPGO_DATA_PROVIDER__PASSWORD: ${POSTGRES_PASSWORD}
      SFTPGO_DATA_PROVIDER__SSLMODE: "0"
      SFTPGO_DATA_PROVIDER__SQL_TABLES_PREFIX: sftpgo_
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "true"
      SFTPGO_DEFAULT_ADMIN_USERNAME: ${SFTPGO_ADMIN_USERNAME:-admin}
      SFTPGO_DEFAULT_ADMIN_PASSWORD: ${SFTPGO_ADMIN_PASSWORD:?Set SFTPGO_ADMIN_PASSWORD in .env before starting SFTPGo}
      # Keep all WebAdmin and WebClient routes beneath the existing hostname's
      # /files prefix. The REST API itself remains /api/v2, which Caddy proxies.
      SFTPGO_HTTPD__WEB_ROOT: /files
      SFTPGO_HTTPD__BINDINGS__0__BASE_URL: https://${N8N_HOST}/files
      SFTPGO_HTTPD__BINDINGS__0__PROXY_ALLOWED: ${NETWORK_SUBNET}
      SFTPGO_HTTPD__BINDINGS__0__CLIENT_IP_PROXY_HEADER: X-Forwarded-For
      # This setup exposes the web file client only. SFTP can be enabled later
      # with a deliberate host-port and firewall policy.
      SFTPGO_SFTPD__BINDINGS__0__PORT: "0"
    volumes:
      - ${ICLOUD_DRIVE_DIR:-/home/ejangi/iCloud Drive}:/srv/sftpgo/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sftpgo", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - n8n_backend

  # 6. SAMBA SERVICE
  # Apple Files connects to SMB shares directly, whereas SFTPGo's /files route
  # is a browser UI. This exposes the same iCloud Drive bind mount as an
  # authenticated SMB share without making it available anonymously.
  samba:
    image: dockurr/samba:4.23.10
    container_name: n8n_samba
    restart: unless-stopped
    environment:
      NAME: iCloudDrive
      USER: files
      PASS: ${SMB_PASSWORD:?Set SMB_PASSWORD in .env before starting Samba}
      # These match the owner of the iCloud Drive directory on the host so
      # files created through SMB retain the expected ownership.
      UID: "1000"
      GID: "1000"
    ports:
      # SMB is a separate protocol from the HTTPS /files route.
      - "445:445/tcp"
    volumes:
      - ${ICLOUD_DRIVE_DIR:-/home/ejangi/iCloud Drive}:/shared

# Volume & Network Definition
volumes:
  n8n_data:
  postgres_data:
  caddy_data: # Define the new Caddy data volume

networks:
  n8n_backend:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${NETWORK_SUBNET}
